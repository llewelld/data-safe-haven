#cloud-config

groups:
  - docker

write_files:
  - encoding: b64
    content: {{entrypoint_sh_content_encoded}}
    path: "/opt/adguardhome/custom/entrypoint.sh"
    permissions: "0644"

  - encoding: b64
    content: {{adguardhome_yaml_content_encoded}}
    path: "/opt/adguardhome/custom/AdGuardHome.yaml"
    permissions: "0644"

  - path: "/home/adguardhome/install_cni_plugin.sh"
    permissions: "0700"
    content: |
      #!/usr/bin/env bash
      pushd /home/adguardhome
      git clone https://github.com/Azure/azure-container-networking.git
      cd ./azure-container-networking/scripts
      chmod u+x install-cni-plugin.sh
      sudo ./install-cni-plugin.sh v1.7.9
      popd

  - path: "/etc/systemd/system/adguardhome.service"
    permissions: "0644"
    content: |
      [Unit]
      Description=Starts the AdGuardHome container.
      Wants=network-online.target
      After=network-online.target

      [Service]
      Type=oneshot
      Environment="HOME=/home/adguardhome"
      ExecStartPre=-/home/adguardhome/install_cni_plugin.sh
      ExecStartPre=/usr/bin/docker login -u <USERNAMEA> -p <PASSWORD>
      ExecStart=/home/adguardhome/azure-container-networking/scripts/docker-run.sh adguardhome default "--restart unless-stopped -v /opt/adguardhome/custom:/opt/adguardhome/custom -p 53:53/tcp -p 53:53/udp -p 80:80/tcp --entrypoint /bin/sh adguard/adguardhome:v0.107.67 /opt/adguardhome/custom/entrypoint.sh"
      ExecStop=/home/adguardhome/azure-container-networking/scripts/docker-del.sh adguardhome default

system_info:
  default_user:
    groups: [docker]

mounts:
  # Mount ephemeral storage at resource instead of default /mnt
  - [ephemeral0, /mnt/scratch]

# Install necessary apt packages
packages:
  - docker.io
  - unattended-upgrades
  - jq
package_update: true
package_upgrade: true

runcmd:
  # Mount all external volumes
  # --------------------------
  - echo ">=== Mounting all external volumes... ===<"
  - grep -v -e '^[[:space:]]*$' /etc/fstab | sed 's|^|  /etc/fstab  |'
  - mount -fav
  - findmnt

final_message: "The system is finally up, after $UPTIME seconds"
